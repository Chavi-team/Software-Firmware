name: 'Publish Release'

# Configurado para rodar em QUALQUER commit enviado para o GitHub, independente da branch
on: [push]

jobs:
  publish-tauri:
    permissions:
      contents: write # Permissão obrigatória para criar a Release e fazer upload dos instaladores
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04' # Este é o seu build para Linux (Ubuntu)
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Instala o target correto do Rust dinamicamente dependendo da arquitetura do macOS
          targets: ${{ matrix.platform == 'macos-latest' && matrix.args != '' && format('{0}', matrix.args == '--target aarch64-apple-darwin' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin') || '' }}

      - name: install dependencies (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: install frontend dependencies
        run: npm install

      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PASSWORD }}
        with:
          tagName: 'v__VERSION__' # O Tauri vai ler a versão automaticamente do seu tauri.conf.json
          releaseName: 'v__VERSION__'
          releaseBody: 'Executáveis de teste gerados automaticamente.'
          releaseDraft: true # Cria como rascunho para você revisar antes de publicar
          prerelease: false
          args: ${{ matrix.args }}